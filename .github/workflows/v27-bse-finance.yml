name: BSE financing history audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v27-bse-finance.yml"
permissions:
  contents: read
  statuses: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --no-cache-dir akshare pandas
      - name: Query 2023-2026 BSE financing samples
        run: python collector/v27_bse_finance_probe.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v27-bse-finance-audit
          path: out/
          retention-days: 30
      - name: Expose audit run link
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          try:
              a=json.load(open('out/bse_financing_samples.json',encoding='utf8'))
              k=sum('raw' in x for x in a)
              ok=k>=8
              message=f'BSE sample dates queried: {k}/{len(a)}'
          except Exception:
              ok=False;message='BSE source audit missing'
          payload=json.dumps({'state':'success' if ok else 'failure','context':'v27/BSE-sample',
            'description':message,'target_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"}).encode()
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",payload,method='POST',
            headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=20) as f:print(f.status)
          PY
