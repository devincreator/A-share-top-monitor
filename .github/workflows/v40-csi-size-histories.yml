name: v40 official size-index point-in-time histories
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/v40-csi-size-histories.yml"]
permissions:
  contents: read
  statuses: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install pandas requests
      - name: Collect CSI multiple index time series
        run: python collector/v40_csi_size_history.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v40-official-csi-index-cross-section
          path: out/csi_size_hist/
          retention-days: 21
      - if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          try:
            a=json.load(open("out/csi_size_hist/index_pit_audit.json",encoding="utf-8"))
            n=sum(x.get("rows",0)>160 for x in a)
            ok=n>=30
            note=f"Official CSI index-year histories downloaded: {n}/48; raw data not yet PIT aligned"
          except Exception as ex:
            ok=False;note=str(ex)[:100]
          p=json.dumps({"state":"success" if ok else "failure","context":"v40/size-index-PIT",
            "description":note[:140],
            "target_url":f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"}).encode()
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",
            p,method="POST",headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","Content-Type":"application/json"})
          with urllib.request.urlopen(req,timeout=20) as response: print(response.status)
          PY
