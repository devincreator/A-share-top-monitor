name: Full official BSE margin history
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v27-bse-full.yml"
permissions:
  contents: read
  statuses: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --no-cache-dir akshare pandas
      - name: Collect BSE per day
        run: python collector/v27_bse_finance_full.py
      - name: Upload auditable CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bse-daily-margin-history
          path: out/
          retention-days: 30
          if-no-files-found: warn
      - name: Expose audit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          try:
              a=json.load(open('out/bse_financing_full_audit.json',encoding='utf8'))
              ok=a.get('status')=='COMPLETE'
              note=f"BSE {a.get('success_dates',0)}/{a.get('total_dates',0)} historical trading days"
          except Exception as exc:
              ok=False;note=str(exc)[:100]
          payload=json.dumps({'state':'success' if ok else 'failure','context':'v27/BSE-historical-margin',
            'description':note,'target_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"}).encode()
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",
            payload,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=20) as f:print(f.status)
          PY
