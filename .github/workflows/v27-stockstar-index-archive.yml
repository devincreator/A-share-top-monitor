name: StockStar index archive pagination audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v27-stockstar-index-archive.yml"
permissions:
  contents: read
  statuses: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests beautifulsoup4
      - run: python collector/stockstar_index_list_probe.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v27-stockstar-index-archive-audit
          path: out/
      - name: Publish probe status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          try:
              z=json.load(open('out/stockstar_pagination.json',encoding='utf8'))
              ok=sum(bool(e.get('article_links')) for e in z)>=3
              msg='StockStar archive pagination usable' if ok else 'StockStar archive pagination unavailable'
          except Exception as e:
              ok=False;msg=str(e)[:120]
          payload=json.dumps({'state':'success' if ok else 'failure','context':'v27/StockStar-archives',
                'description':msg,'target_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"}).encode()
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",payload,method='POST',
                headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=20) as resp:print(resp.status)
          PY
