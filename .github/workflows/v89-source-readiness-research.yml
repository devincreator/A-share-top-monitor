name: V89 independent index and financing source research (no alerts)

on:
  workflow_dispatch:
  schedule:
    # Beijing 08:30 on weekdays, after V88 first-published daily source ledger.
    - cron: '30 0 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'research/v89_factor_inputs/*.py'
      - '.github/workflows/v89-source-readiness-research.yml'

permissions:
  contents: read

concurrency:
  group: research-v89-source-readiness
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run fail-closed source data gate tests
        run: |
          python -m unittest discover -s research/v89_factor_inputs -p 'test_*.py' -v
          python -m unittest discover -s research/v88_daily_observations -p 'test_*.py' -v
      - name: Install read-only index and financing provider wrappers
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'akshare>=1.15' pandas requests
      - name: Probe recent verified raw date and independent primitive candidates
        run: |
          python research/v89_factor_inputs/collect_candidates.py \
            --raw-ledger research/v88_daily_observations/ledger \
            --output-dir v89_source_audit_output
      - name: Generate past-only research price factors where index source checks passed
        run: |
          python research/v89_factor_inputs/price_only_research.py --source-dir v89_source_audit_output
      - name: Keep all raw responses, failure reasons and independent gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v89-index-financing-source-${{ github.run_id }}
          path: v89_source_audit_output/
          retention-days: 30
          if-no-files-found: warn
