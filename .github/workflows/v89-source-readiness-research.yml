name: V89 independent index and financing source research (no alerts)

on:
  workflow_dispatch:
  schedule:
    # Beijing 08:30 on weekdays, after V88 first-published daily source ledger.
    - cron: '30 0 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'research/v89_factor_inputs/*.py'
      - 'research/v90_financing/*.py'
      - '.github/workflows/v89-source-readiness-research.yml'

permissions:
  contents: write

concurrency:
  group: research-v89-source-readiness
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run fail-closed source data gate tests
        run: |
          python -m unittest discover -s research/v89_factor_inputs -p 'test_*.py' -v
          python -m unittest discover -s research/v88_daily_observations -p 'test_*.py' -v
          python -m unittest discover -s research/v90_financing -p 'test_*.py' -v
      - name: Install read-only index and financing provider wrappers
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'akshare>=1.15' pandas requests
      - name: Probe recent verified raw date and independent primitive candidates
        run: |
          python research/v89_factor_inputs/collect_candidates.py \
            --raw-ledger research/v88_daily_observations/ledger \
            --output-dir v89_source_audit_output
      - name: Audit V90 financing factor windows against 000985 actual index sessions
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, sys
          folder=pathlib.Path("v89_source_audit_output")
          report=json.loads((folder/"source_matrix.json").read_text(encoding="utf8"))
          asof=report.get("asof_selected_from_raw_ledger")
          if not asof:
              (folder/"finance_windows.json").write_text(json.dumps({
                  "status":"BLOCKED_NO_VERIFIED_SOURCE_DAY","formal_signal_allowed":False
              })+"\n")
          else:
              subprocess.run([sys.executable,"research/v90_financing/isolate_window.py",
                  "--input",str(folder/"candidate_inputs.json"),"--asof",asof,
                  "--output",str(folder/"finance_windows.json")],check=True)
          PY
      - name: Generate past-only research price factors where index source checks passed
        run: |
          python research/v89_factor_inputs/price_only_research.py --source-dir v89_source_audit_output
      - name: Preserve first non-trading price research snapshot only when cross-verified
        run: |
          python research/v89_factor_inputs/save_first_capture.py \
            --report v89_source_audit_output/price_only_research.json \
            --ledger research/v89_factor_inputs/observations \
            --audit-dir v89_source_audit_output
      - name: Keep all raw responses, failure reasons and independent gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v89-index-financing-source-${{ github.run_id }}
          path: v89_source_audit_output/
          retention-days: 30
          if-no-files-found: warn
      - name: Commit bounded provenance summaries, never production or formal signals
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d research/v89_factor_inputs/observations ]; then
            echo 'No verified research price snapshot; keep blocked.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/v89_factor_inputs/observations/
          if git diff --cached --quiet; then
            echo 'Same verified observation already retained.'
            exit 0
          fi
          git commit -m 'research(v89): archive checked price factor first observation [skip ci]'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep 3
          done
          echo 'Archive push failed; review source artifact.'
          exit 1
