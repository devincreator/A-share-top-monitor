name: V113 SHSZ list exact missing stocks and date pairs from raw shards
on:
  push:
    branches: [research/v111-assumed-lag-data-inventory-20261022]
    paths: ['.github/workflows/v113-shsz-list-gaps.yml']
permissions:
  contents: read
  actions: read
jobs:
  gaps:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v111-assumed-lag-data-inventory-20261022
      - uses: actions/download-artifact@v4
        with:
          run-id: 39895352257
          pattern: v113-bao-stock-full-shard-*-39895352257
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source_shards
      - uses: actions/download-artifact@v4
        with:
          run-id: 39892479046
          name: v113-baostock-real-archive-39892479046
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: basic
      - uses: actions/download-artifact@v4
        with:
          run-id: 39739950143
          name: v111-real-sources-assumed-lag-39739950143
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: anchor
      - run: |
          python research/v113_breadth/list_shsz_gaps.py \
            --anchor anchor/v111_normalized/daily_unified.csv \
            --basic basic/stock_basic.csv \
            --shards source_shards --out exact_shsz_missing
      - uses: actions/upload-artifact@v4
        with:
          name: v113-shsz-exact-date-gap-audit-${{ github.run_id }}
          path: exact_shsz_missing/
          retention-days: 90
