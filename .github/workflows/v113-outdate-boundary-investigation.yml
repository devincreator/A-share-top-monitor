name: V113 SHSZ audit mixed outDate versus last observed bar by stock
on:
  push:
    branches: [research/v111-assumed-lag-data-inventory-20261022]
    paths: ['.github/workflows/v113-outdate-boundary-investigation.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v111-assumed-lag-data-inventory-20261022
      - uses: actions/download-artifact@v4
        with:
          run-id: 39895352257
          pattern: v113-bao-stock-full-shard-*-39895352257
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: stock_shards
      - run: python research/v113_breadth/audit_delist_enddates.py --source-dir stock_shards --out v113_delist_date_audit
      - uses: actions/upload-artifact@v4
        with:
          name: v113-shsz-last-trade-date-audit-${{ github.run_id }}
          path: v113_delist_date_audit/
