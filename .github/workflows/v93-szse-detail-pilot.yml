name: V93 SZSE detail versus market margin balance precision pilot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v93-szse-detail-pilot.yml'
      - 'research/v93_szse_exact_margin/*.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: v93-szse-detail-research
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source financial unit and missing-holdings rejection tests
        run: python -m unittest discover -s research/v93_szse_exact_margin -p 'test_*.py' -v
      - name: Download immutable V89 baseline for exchange source comparison
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          runid="$(gh run list --workflow v89-source-readiness-research.yml --branch main --limit 20 --json databaseId,conclusion --jq '[.[] | select(.conclusion == "success")][0].databaseId')"
          if [ -z "$runid" ] || [ "$runid" = "null" ]; then
            echo 'No successful V89 historical candidate source run'
            exit 1
          fi
          mkdir -p v89_source_audit_output
          gh run download "$runid" --name "v89-index-financing-source-$runid" --dir v89_source_audit_output
          test -s v89_source_audit_output/candidate_inputs.json
          echo "$runid" > v89_source_audit_output/provenance_run_id.txt
      - name: Install read-only exchange wrapper
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'akshare>=1.15' pandas requests openpyxl
      - name: Compare 2024 zero anomaly, 2025 gap and 2026 baseline full SZSE details
        run: |
          python research/v93_szse_exact_margin/probe_detail.py \
            --candidate v89_source_audit_output/candidate_inputs.json \
            --out v93_szse_detail_pilot
      - name: Retain original per-security CSV and sum-level discrepancies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v93-szse-margin-detail-${{ github.run_id }}
          path: |
            v93_szse_detail_pilot/
            v89_source_audit_output/provenance_run_id.txt
          retention-days: 30
          if-no-files-found: warn
