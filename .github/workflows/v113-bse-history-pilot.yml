name: V113 Beijing Stock Exchange old/new code and per-symbol historical daily bars pilot
on:
  push:
    branches: [research/v111-assumed-lag-data-inventory-20261022]
    paths:
      - '.github/workflows/v113-bse-history-pilot.yml'
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install akshare
      - run: python research/v113_breadth/pilot_beijing_stock.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v113-beijing-historical-${{ github.run_id }}
          path: v113_beijing_pilot/
          retention-days: 90
