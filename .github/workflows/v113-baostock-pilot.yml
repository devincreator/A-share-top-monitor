name: V113 BaoStock multi-year history and historical-universe pilot
on:
  push:
    branches: [research/v111-assumed-lag-data-inventory-20261022]
    paths:
      - '.github/workflows/v113-baostock-pilot.yml'
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install baostock
      - run: python research/v113_breadth/pilot_baostock.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v113-baostock-real-archive-${{ github.run_id }}
          path: v113_baostock_pilot/
          retention-days: 90
