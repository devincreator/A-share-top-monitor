name: V111 historical data re-acquisition and assumed-lag inventory
on:
  push:
    branches: [research/v111-assumed-lag-data-inventory-20261022]
    paths:
      - 'research/v111_data_inventory/**'
      - '.github/workflows/v111-historical-data.yml'
  pull_request:
    paths:
      - 'research/v111_data_inventory/**'
      - '.github/workflows/v111-historical-data.yml'
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate unified source schema and lag safety
        run: python -m unittest discover -s research/v111_data_inventory -p 'test_*.py' -v
      - name: Install acquisition providers
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'akshare>=1.15' pandas requests
      - name: Re-acquire original historical index price volume and financing sources
        run: |
          python research/v89_factor_inputs/collect_candidates.py \
            --raw-ledger research/v88_daily_observations/ledger \
            --output-dir v111_raw_acquisition
      - name: Consolidate actual rows, quarantine missing or invalid financing
        run: |
          python research/v111_data_inventory/consolidate.py \
            --input v111_raw_acquisition/candidate_inputs.json \
            --out v111_normalized \
            --official-dir v111_raw_acquisition \
            --frozen-price-csv research/v97_event_intake/observations/index_000985_prices_20220223_20261020.csv
      - name: Upload raw source and coverage bundle (research only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v111-real-sources-assumed-lag-${{ github.run_id }}
          path: |
            v111_raw_acquisition/
            v111_normalized/
          retention-days: 90
          if-no-files-found: warn
