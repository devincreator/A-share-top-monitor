name: V113 SHSZ-only historical 20 60 120 252-session breadth factor build
on:
  push:
    branches: [research/v111-assumed-lag-data-inventory-20261022]
    paths: ['.github/workflows/v113-shsz-only-rolling-factors.yml']
permissions:
  contents: read
  actions: read
jobs:
  factors:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v111-assumed-lag-data-inventory-20261022
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m py_compile research/v113_breadth/rolling_v113_breadth.py
          python -m unittest discover -s research/v113_breadth -p 'test_*.py' -v
      - uses: actions/download-artifact@v4
        with:
          run-id: 39895352257
          pattern: v113-bao-stock-full-shard-*-39895352257
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: shsz_source
      - uses: actions/download-artifact@v4
        with:
          run-id: 39739950143
          name: v111-real-sources-assumed-lag-39739950143
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: anchor
      - name: Reconstruct strictly SHSZ-only dynamic breadth (no BSE)
        run: |
          python research/v113_breadth/rolling_v113_breadth.py \
            --shsz-shards shsz_source \
            --anchor anchor/v111_normalized/daily_unified.csv \
            --out v113_shsz_rolling_only
      - uses: actions/upload-artifact@v4
        with:
          name: v113-shsz-only-rolling-factors-${{ github.run_id }}
          path: v113_shsz_rolling_only/
          retention-days: 90
