name: Research historical annual source backfill batch (not PIT)
on:
  push:
    branches: [research/hs-pit-audit-20261027]
    paths:
      - '.github/workflows/hs-backfill-2007-pilot.yml'
  workflow_dispatch:
    inputs:
      year:
        description: "Year 2007–2025"
        required: true
        type: choice
        options: ['2007','2008','2009','2010','2011','2012','2013','2014','2015','2016','2017','2018','2019','2020','2021','2022','2023','2024','2025']
      max_days:
        description: "Bounded source fetches in one batch"
        required: true
        default: '35'
permissions:
  contents: write
concurrency:
  group: hs-history-archive
  cancel-in-progress: false
jobs:
  bounded-year:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Load source by dated calendar and audit
        env:
          TARGET_YEAR: ${{ github.event.inputs.year || '2007' }}
          MAX_DAYS: ${{ github.event.inputs.max_days || '35' }}
        run: |
          python research/hs_pit_audit/backfill_year.py --year "$TARGET_YEAR" --max-days "$MAX_DAYS"
      - name: Commit auditable raw partial data to research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/historical_data
          if ! git diff --cached --quiet; then
            git commit -m "research: archive bounded historical daily source batch (not PIT)"
            git push origin HEAD:research/hs-pit-audit-20261027
          fi
