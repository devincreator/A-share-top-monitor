name: v27 archived turnover article probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/v27-turnover-archive-probe.yml"]
permissions:
  contents: read
  statuses: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests beautifulsoup4
      - run: python collector/stockstar_archive_probe.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v27-archive-probe
          path: out/
          retention-days: 20

      - name: Publish archive probe result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          try:
              records=json.load(open('out/stockstar_archive_probe.json'))
              hits=sum(len(x.get('hits',[])) for x in records)
              state='success' if hits>0 else 'failure'
              desc=f'Search archive contains {hits} raw article links'
          except Exception as e:
              state='failure'
              desc=('Archive probe unavailable: '+str(e))[:130]
          payload=json.dumps({
              'state':state,'context':'v27/stockstar-archive-probe',
              'description':desc[:140],
              'target_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          }).encode()
          u=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}"
          request=urllib.request.Request(u,payload,method='POST',headers={
             'Authorization':'Bearer '+os.environ['GH_TOKEN'],
             'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          with urllib.request.urlopen(request,timeout=20) as r:print('Status',r.status)
          PY
