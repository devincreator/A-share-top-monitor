name: V103 first-observed official index preopen evidence (research only)
on:
  schedule:
    # 09:10 Asia/Shanghai. GitHub Actions may be delayed; script fails closed at 09:20.
    - cron: '10 1 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/v103_forward_preopen/*.py'
      - '.github/workflows/v103-forward-first-capture.yml'
permissions:
  contents: write
concurrency:
  group: v103-research-first-capture
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify fail-closed clock, raw identity, and immutable source tests
        run: python -m unittest discover -s research/v103_forward_preopen -p 'test_*.py' -v
      - name: Record official 000985 first observed source bytes, never model signals
        if: github.event_name == 'schedule'
        run: python research/v103_forward_preopen/first_capture.py
      - name: Verify archived source and decision-time integrity before any publish
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          sys.path.insert(0, 'research/v103_forward_preopen')
          from first_capture import verify_first_capture
          d = datetime.now(ZoneInfo('Asia/Shanghai')).date().isoformat()
          root = Path('research/v103_forward_preopen/observations') / d
          summary = verify_first_capture(root/'first_capture.json',
                                         root/'official_index_raw.json')
          print('FIRST_CAPTURE_READBACK_VERIFIED', summary)
          if summary['status'] != 'PASS_PREOPEN_RAW_SOURCE_OBSERVED_RESEARCH_ONLY':
              print('::warning::V103 true source-evidence gate is BLOCKED for this run; archiving original failure.')
          else:
              print('V103 observed real official-index raw response within decision cutoff; not a prediction.')
          PY
      - name: Preserve first-capture evidence even when GitHub write fails
        if: always() && github.event_name == 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: v103-first-observed-source-${{ github.run_id }}
          path: research/v103_forward_preopen/observations/
          retention-days: 90
          if-no-files-found: warn
      - name: Archive only immutable research evidence
        if: success() && github.event_name == 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/v103_forward_preopen/observations/
          if git diff --cached --quiet; then
            echo 'No new first capture. Never overwrite old evidence.'
            exit 0
          fi
          git commit -m 'research(v103): preserve future preopen source first observation [skip ci]'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep 3
          done
          echo 'Commit failed; raw evidence retained in workflow artifact.'
          exit 1
      - name: Fail scheduled job when first-observation evidence is BLOCKED
        if: always() && github.event_name == 'schedule'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          d = datetime.now(ZoneInfo('Asia/Shanghai')).date().isoformat()
          record_path = Path('research/v103_forward_preopen/observations') / d / 'first_capture.json'
          if not record_path.is_file():
              print('::error::V103 capture manifest missing; scheduled evidence gate BLOCKED')
              raise SystemExit(1)
          record = json.loads(record_path.read_text(encoding='utf-8'))
          status = record.get('status', 'BLOCKED')
          reason = record.get('reason', 'UNKNOWN')
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write(f"### V103 source-observation gate\n\nDate: {d}  \nStatus: **{status}**  \nReason: {reason}\n")
          if status != 'PASS_PREOPEN_RAW_SOURCE_OBSERVED_RESEARCH_ONLY':
              print(f'::error::V103 scheduled source observation BLOCKED: {reason}')
              raise SystemExit(1)
          print('V103 source observation PASS (research only; no model signal)')
          PY
