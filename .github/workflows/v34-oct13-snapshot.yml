name: v34 Oct 13 public index snapshot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v34-oct13-snapshot.yml"
permissions:
  contents: read
  statuses: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --no-cache-dir akshare pandas requests
      - name: Collect public index and margin
        run: python collector/v34_oct13_snapshot.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v34-oct13-public-data
          path: out/v34_20261013_public_snapshot.json
          retention-days: 14
      - if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          try:
              d=json.load(open('out/v34_20261013_public_snapshot.json'))
              q=d['sources']['ashareapi_sh000985']
              ok=any(z.get('date')=='2026-10-13' for z in q)
              msg='Oct13 CSI 000985 price '+str(next((z.get('last') for z in q if z.get('date')=='2026-10-13'),None))
          except Exception as e:
              ok=False;msg=str(e)[:140]
          b=json.dumps({'state':'success' if ok else 'failure','context':'v34/Oct13-price','description':msg[:135],
              'target_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"}).encode()
          request=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",b,method='POST',
            headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json','Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request,timeout=20) as r:print(r.status)
          PY
