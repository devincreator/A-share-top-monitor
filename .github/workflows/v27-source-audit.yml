name: v27 market source audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v27-source-audit.yml"

permissions:
  contents: read
  statuses: write

jobs:
  collect-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir "akshare>=1.15" "pandas>=2.1" "numpy>=1.24" "pytest>=8"
      - name: Verify causal computations
        run: python -m pytest -q tests/test_v27_collector.py
      - name: Collect primary source histories
        run: python collector/v27_collect.py
      - name: Save data and audit records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v27-market-data-audit
          path: out/
          retention-days: 30
          if-no-files-found: warn
      - name: Publish machine-readable run status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          try:
              audit = json.load(open('out/audit.json', encoding='utf-8'))
              ok = audit.get('status') == 'RAW_FEATURES_VERIFIED_ONLY'
              note = 'Source factors verified' if ok else ('; '.join(audit.get('errors', [])) or 'Source verification failed')
          except Exception:
              ok, note = False, 'No source data audit artifact'
          body = json.dumps({
              'state': 'success' if ok else 'failure',
              'context': 'v27/source-data-audit',
              'description': note[:140],
              'target_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          }).encode('utf-8')
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}"
          req = urllib.request.Request(url, body, method='POST', headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json'
          })
          with urllib.request.urlopen(req,timeout=20) as response:
              print('Status posted:',response.status, 'verified=' + str(ok))
          PY
