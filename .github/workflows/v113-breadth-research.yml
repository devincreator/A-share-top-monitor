name: V113 historical breadth candidate source audit
on:
  push:
    branches: [research/v111-assumed-lag-data-inventory-20261022]
    paths:
      - 'research/v113_breadth/**'
      - '.github/workflows/v113-breadth-research.yml'
  pull_request:
    paths:
      - 'research/v113_breadth/**'
      - '.github/workflows/v113-breadth-research.yml'
permissions:
  actions: read
  contents: read
jobs:
  breadth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run strict candidate breadth tests
        run: python -m unittest discover -s research/v113_breadth -p 'test_*.py' -v
      - name: Download fixed V111 1129-day anchor
        uses: actions/download-artifact@v4
        with:
          run-id: 39739950143
          name: v111-real-sources-assumed-lag-39739950143
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: historical_anchor
      - name: Install spreadsheet source reader
        run: python -m pip install --disable-pip-version-check --no-cache-dir pandas requests python-calamine
      - name: Attempt original 2015-2026 third-party market-breadth archives
        run: python research/v113_breadth/collect_breadth.py
      - name: Audit exact 2022-2026 market date coverage, not PIT
        run: |
          python research/v113_breadth/audit_breadth.py \
            --daily historical_anchor/v111_normalized/daily_unified.csv \
            --breadth out/breadth_2015_2026_source_unverified.csv \
            --out out/v113_acceptance.json
      - name: Archive downloaded candidate breadth and audit, even if source fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v113-breadth-source-audit-${{ github.run_id }}
          path: out/
          retention-days: 90
          if-no-files-found: warn
