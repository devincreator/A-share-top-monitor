name: v27 index turnover pagination and frozen rank validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v27-turnover-paginated.yml"
permissions:
  contents: read
  statuses: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests pandas
      - run: python collector/v27_turnover_pagination.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v27-turnover-paginated-historical
          path: out/
          retention-days: 30
      - name: Publish rank validation
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          try:
              a=json.load(open('out/turnover_pagination_audit.json',encoding='utf8'))
              ok=a.get('status')=='VERIFIED_FROZEN_P252'
              msg=f"{a.get('records_unique',0)} turnover daily rows; frozen p252 verified={ok}"
          except Exception as e:ok=False;msg=str(e)[:140]
          body=json.dumps({'state':'success' if ok else 'failure','context':'v27/turnover-p252-frozen-anchor',
          'description':msg,'target_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"}).encode()
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",body,
          method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json','Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=20) as r:print(r.status)
          PY
