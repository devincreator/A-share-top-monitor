<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A股拐点监测 · 本地重建</title>
<style>
:root{--nav:#123c5b;--muted:#667e90;--line:#dfe7ed;--red:#b9464e;--green:#247a5b}*{box-sizing:border-box}body{margin:0;background:#f3f6f8;color:#18344b;font-family:system-ui,"Microsoft YaHei",sans-serif;font-size:14px}header{background:#fff;border-bottom:1px solid var(--line)}.wrap{max-width:1320px;margin:auto;padding:22px}.brand{display:flex;justify-content:space-between;gap:20px;align-items:center}h1{font-size:26px;margin:3px 0}h2{font-size:23px;margin:4px 0 12px}h3{margin:0 0 13px;font-size:17px}p{line-height:1.8;margin:8px 0}.eyebrow{font-size:11px;letter-spacing:.12em;color:var(--muted)}.muted,small{color:var(--muted)}.badge{display:inline-block;padding:6px 10px;border:1px solid #e6d4ae;border-radius:20px;color:#80601d;background:#fffaf0;font-size:12px}nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px}button,select,input{font:inherit}button,select{cursor:pointer;background:#fff;border:1px solid var(--line);padding:8px 13px;border-radius:7px;color:#38566d}button.on{background:var(--nav);color:#fff}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:22px;margin-bottom:14px}.hero{background:linear-gradient(120deg,#fff,#edf5fa)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{border-top:3px solid #35769e}.stat strong{font-size:26px;display:block;margin:10px 0}.two{display:grid;grid-template-columns:1.45fr 1fr;gap:14px}.alert{background:#fff9ee;border-left:3px solid #b78b36;padding:13px 17px;margin:14px 0;line-height:1.8}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}canvas{width:100%;height:330px;display:block}.chart-note{min-height:24px;color:var(--muted);font-size:12px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:13px}th,td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);background:#f8fafc}.pass{color:var(--green)}.warn{color:#996c23}a{color:#286c99;text-decoration:none}a:hover{text-decoration:underline}.rule{border-bottom:1px solid var(--line);padding:10px 0;line-height:1.8}.rule b{display:block}.hidden{display:none}footer{padding:10px 0 25px;color:var(--muted);line-height:1.8;font-size:12px}.checks{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:5px 9px;background:#f0f5f8;border-radius:6px;font-size:12px}.dateinput{padding:8px;border:1px solid var(--line);border-radius:7px}details{line-height:1.9}summary{cursor:pointer}.legend{display:flex;gap:15px;font-size:12px;color:var(--muted);margin:10px 0}.legend span:before{content:'●';color:var(--c);margin-right:5px}.metric-num{font-variant-numeric:tabular-nums}@media(max-width:760px){.wrap{padding:15px}.brand{display:block}.grid{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}h1{font-size:22px}.card{padding:16px}.toolbar{align-items:flex-start}canvas{height:280px}nav button{padding:8px 10px}.stat strong{font-size:21px}}
</style></head><body>
<header><div class="wrap"><div class="brand"><div><div class="eyebrow">A-SHARE TURNING MONITOR · LOCAL REBUILD</div><h1>A股 5%／9% 拐点监测</h1><p class="muted">恢复原版规则，逐日重算输入、相位与研究信号</p></div><div><span class="badge">历史研究 · 收盘后计算</span><p>数据截至 <b id="asof"></b></p></div></div><nav id="nav"></nav></div></header>
<main class="wrap"><div id="summary"></div><div id="module" class="hidden"></div><div id="audit" class="hidden"></div>
<section class="card"><div class="toolbar"><h3 id="chartTitle">中证全指与研究事件</h3><div><select id="window"><option value="126">最近126日</option><option selected value="504">最近504日</option><option value="all">全部历史</option></select> <select id="feature"><option value="price">指数收盘</option><option value="rvP756">RV20／RV120历史分位</option><option value="ret63P756">63日收益历史分位</option><option value="turnoverAmtP252">成交额252日分位</option><option value="turnoverRateP252">换手率252日分位</option><option value="styleDd20">风格20日回撤</option><option value="finance63GrowthP756">融资增长历史分位</option></select></div></div><div class="legend"><span style="--c:#526575">当前序列</span><span style="--c:#d6a132">新增研究信号</span><span style="--c:#b9464e">事后确认的客观顶底</span></div><canvas id="chart"></canvas><p class="chart-note" id="chartNote">移动到曲线上查看日期与数值。客观拐点用于事后标注，不能当作当时已知信号。</p></section>
<section class="card"><div class="toolbar"><h3>逐日数据与指标</h3><div><label>查看日期 <select id="day" class="dateinput"></select></label> <button id="download">导出全部逐日数据</button></div></div><div class="scroll"><table id="daily"></table></div><p class="muted" id="dailyNote"></p></section>
<footer>本地重建，未修改生产页面。8月4日后使用新来源候选数据，尚未完成旧口径等价、历史公布时点和原评分映射认证。<br><a href="original_v30_archive.html">查看原版界面与存档评分</a> · <a href="outputs/reconstruction_audit.json">重建核验记录</a> · <a href="outputs/source_overlap.csv">来源重叠对账</a> · <a href="README.md">运行与数据说明</a></footer></main>
<script>const DATA=__DATA__;
const $=s=>document.querySelector(s),names={summary:'总览',top5:'Top-5',top9:'Top-9',bottom5:'Bottom-5',bottom9:'Bottom-9',audit:'数据核验'};
let active='summary',visible=[];
const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(v,n=2)=>v===null||v===undefined?'—':Number(v).toLocaleString('zh-CN',{minimumFractionDigits:n,maximumFractionDigits:n});
const last=DATA.daily.at(-1),lastExe=DATA.execution.at(-1);
$('#asof').textContent=DATA.audit.asof;
$('#nav').innerHTML=Object.entries(names).map(([k,n])=>`<button data-key="${k}" class="${k==='summary'?'on':''}">${n}</button>`).join('');
const statistic=(title,value,note)=>`<article class="card stat"><span class="muted">${title}</span><strong>${value}</strong><small>${note}</small></article>`;
$('#summary').innerHTML=`<article class="card hero"><div class="eyebrow">RECONSTRUCTED FROM ORIGINAL RAW HISTORY</div><h2>历史规则已复现，新增数据进入研究对照</h2><p>截至2026-08-04，四模块 <b>190条原始预警日期全部一致</b>；原版156个客观顶底日期全部一致。</p><div class="checks"><span class="pill">5%相位：${last.phase5}</span><span class="pill">9%相位：${last.phase9}</span><span class="pill">新增数据49日</span><span class="pill">未来数据扰动检查通过</span></div><div class="alert">原主表与新融资来源存在实质差异；新融资采用完整同源历史计算，避免跨来源跳变制造增长率。新结果保持研究状态，不延用原版胜率，也不显示未经重建的评分。</div></article><div class="grid">${statistic('中证全指',fmt(last.all_a_close),'截至'+last.date)}${statistic('5日收益',fmt(last.ret5)+'%','使用当日收盘及以前数据')}${statistic('沪深融资余额',fmt(last.financing_balance/1e8)+'亿元','iFinD候选序列')}${statistic('候选执行仓位',lastExe?fmt(lastExe.position_after_close*100,0)+'%':'—','冻结仓位接续；不是实盘建议')}</div><div class="two"><section class="card"><h3>新来源期间的研究信号</h3><table><thead><tr><th>日期</th><th>模块</th><th>路线</th></tr></thead><tbody>${DATA.events.map(e=>`<tr><td>${e.date}</td><td>${names[e.module]}</td><td>${e.route}</td></tr>`).join('')}</tbody></table><p class="muted">这里只列8月4日之后的新计算；不是当年真实发出的通知。</p></section><section class="card"><h3>本次恢复到哪一层</h3><p>已恢复六项原始字段、价格与融资指标、四模块正式事件规则、5%／9%相位和增量执行逻辑。</p><p class="muted">原版连续评分映射尚未恢复。原版分数和回测绩效保存在独立存档页，未冒称新计算结果。</p></section></div>`;
function renderModule(k){const s=last;const signal=DATA.events.filter(e=>e.module===k).at(-1);$('#module').innerHTML=`<section class="card hero"><div class="eyebrow">${names[k]} · RULE REPLAY</div><h2>${names[k]} ${k.startsWith('top')?'顶部预警':'底部预警'}</h2><p>当前相位 ${k.endsWith('5')?s.phase5:s.phase9}；最新新来源研究事件：${signal?signal.date+' · Route '+signal.route:'无'}。</p><p class="muted">原版分数不作新计算展示。下列条件来自已找回的模型规则，逐日实值可在下方核对。</p></section><section class="card"><h3>冻结规则</h3>${DATA.originalRules[k].map(([a,b])=>`<div class="rule"><b>${esc(a)}</b>${esc(b)}</div>`).join('')}<p class="muted">Top-9的融资门在已恢复源码中约束A／B／C，延迟B也必须通过；以源码为准。</p></section>`;}
$('#audit').innerHTML=`<section class="card hero"><h2>数据和复现核验</h2><p>历史一致与新来源可用分开验收。文件存在、程序成功均不代表历史时点认证通过。</p></section><section class="card scroll"><table><thead><tr><th>核验项</th><th>结果</th><th>边界</th></tr></thead><tbody>${Object.entries(DATA.audit.historical_signal_replay.modules).map(([k,v])=>`<tr><td>${k}历史事件</td><td class="pass">${v.calculated_count}／${v.target_count} 一致</td><td>截至2026-08-04</td></tr>`).join('')}<tr><td>原版客观拐点</td><td class="pass">156／156日期一致</td><td>同时核对确认日截点</td></tr><tr><td>冻结净值调仓还原</td><td class="pass">55次；冻结仓位0%</td><td>从净值推断，不是独立策略收益验证</td></tr><tr><td>滚动分位</td><td>包含当日，并列平均排名</td><td>收盘后模型，不能当作当日盘前模型</td></tr><tr><td>新来源完整性</td><td class="pass">49日六字段齐全</td><td>数据截至2026-10-20</td></tr><tr><td>历史发布时间</td><td class="warn">未认证</td><td>事后获取的历史序列</td></tr><tr><td>原评分映射</td><td class="warn">未恢复</td><td>仅保留原HTML存档</td></tr></tbody></table></section><section class="card"><h3>新旧来源25日重叠对账</h3><div class="scroll"><table><thead><tr><th>字段</th><th>日期数</th><th>最大绝对差</th></tr></thead><tbody>${Object.entries(DATA.dataAudit.overlap).map(([k,v])=>`<tr><td>${k}</td><td>${v.rows}</td><td>${fmt(v.max_abs_difference,4)}</td></tr>`).join('')}</tbody></table></div><p>三条指数收盘完全一致；成交额有显示精度差异。原主表2026-07-20换手率为0，新来源为2.0269%，没有静默覆盖原数据。</p><p>融资余额最大差约1,572亿元，市场范围或供应商定义仍待核实。新融资不与旧余额混算63日增长率；全部原始回执及差异表均保留。</p></section>`;
function switchTab(k){active=k;for(const id of ['summary','module','audit'])$('#'+id).classList.add('hidden');$('#'+(k==='summary'?'summary':k==='audit'?'audit':'module')).classList.remove('hidden');if(k!=='summary'&&k!=='audit')renderModule(k);document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.key===k));draw();}
$('#nav').onclick=e=>{if(e.target.dataset.key)switchTab(e.target.dataset.key)};
$('#day').innerHTML=DATA.daily.map((r,i)=>`<option value="${i}" ${i===DATA.daily.length-1?'selected':''}>${r.date}</option>`).reverse().join('');
const columns=[['all_a_close','全A收盘'],['hs300_close','沪深300'],['zz1000_close','中证1000'],['turnover','成交额（元，显示近似）'],['turnover_rate','换手率%'],['financing_balance','融资余额（元）'],['ret5','5日收益%'],['up20','距20日低点涨幅%'],['up60','距60日低点涨幅%'],['dd20','20日回撤%'],['dd60','60日回撤%'],['rvP756','RV历史分位%'],['ret63P756','63日收益分位%'],['turnoverAmtP252','成交额分位%'],['turnoverRateP252','换手率分位%'],['styleDd20','风格回撤%'],['finance63GrowthP756','融资增长分位%']];
function daily(){let r=DATA.daily[Number($('#day').value)];$('#daily').innerHTML='<thead><tr><th>指标</th><th>实值</th><th>指标</th><th>实值</th></tr></thead><tbody>'+columns.map((c,i)=>i%2?'':`<tr><td>${c[1]}</td><td class="metric-num">${fmt(r[c[0]],4)}</td><td>${columns[i+1]?.[1]??''}</td><td class="metric-num">${columns[i+1]?fmt(r[columns[i+1][0]],4):''}</td></tr>`).join('')+'</tbody>';$('#dailyNote').textContent=r.date+' · '+(r.date>'2026-08-04'?'新来源研究数据，融资使用完整同源历史。':'旧市场原始记录；本表融资特征使用iFinD研究序列，原版190条事件另以未修改旧数据复现。');}
$('#day').onchange=daily;daily();
function draw(){const cv=$('#chart'),ctx=cv.getContext('2d'),width=cv.clientWidth,height=cv.clientHeight,dpr=devicePixelRatio||1;cv.width=width*dpr;cv.height=height*dpr;ctx.scale(dpr,dpr);const n=$('#window').value==='all'?DATA.daily.length:Number($('#window').value);visible=DATA.daily.slice(-n);const field=$('#feature').value,key=field==='price'?'all_a_close':field,values=visible.map(r=>r[key]).filter(x=>x!==null&&Number.isFinite(x));ctx.clearRect(0,0,width,height);if(!values.length)return;let min=Math.min(...values),max=Math.max(...values);const span=Math.max(max-min,.01);min-=span*.08;max+=span*.08;const x=i=>58+i/(visible.length-1)*(width-80),y=v=>height-30-(v-min)/(max-min)*(height-50);ctx.font='11px system-ui';ctx.fillStyle='#718493';ctx.strokeStyle='#e4ebf0';for(let j=0;j<5;j++){let v=min+(max-min)*j/4;ctx.beginPath();ctx.moveTo(55,y(v));ctx.lineTo(width-15,y(v));ctx.stroke();ctx.fillText(fmt(v,field==='price'?0:1),2,y(v)+4);}ctx.strokeStyle='#526575';ctx.lineWidth=1.6;ctx.beginPath();let started=false;visible.forEach((r,i)=>{let v=r[key];if(v===null){started=false;return;}started?ctx.lineTo(x(i),y(v)):ctx.moveTo(x(i),y(v));started=true});ctx.stroke();if(field==='price'){let k=active in DATA.objective?active:'top5';for(const p of DATA.objective[k]){let i=visible.findIndex(r=>r.date===p.date);if(i<0)continue;ctx.fillStyle='#b9464e';ctx.beginPath();ctx.arc(x(i),y(visible[i].all_a_close),4,0,2*Math.PI);ctx.fill();}for(const e of DATA.events.filter(e=>!(active in DATA.objective)||e.module===active)){let i=visible.findIndex(r=>r.date===e.date);if(i<0)continue;ctx.fillStyle='#d6a132';ctx.beginPath();ctx.moveTo(x(i),y(visible[i].all_a_close)-10);ctx.lineTo(x(i)-5,y(visible[i].all_a_close)-20);ctx.lineTo(x(i)+5,y(visible[i].all_a_close)-20);ctx.fill();}}ctx.fillStyle='#718493';for(let i=0;i<visible.length;i+=Math.max(1,Math.floor(visible.length/5)))ctx.fillText(visible[i].date.slice(0,7),x(i)-20,height-7);$('#chartTitle').textContent=$('#feature').selectedOptions[0].text+(active in DATA.objective?' · '+names[active]:'');}
$('#chart').onmousemove=e=>{const box=e.target.getBoundingClientRect();let i=Math.max(0,Math.min(visible.length-1,Math.round((e.clientX-box.left-58)/(box.width-80)*(visible.length-1))));let r=visible[i];$('#chartNote').textContent=r.date+' · '+$('#feature').selectedOptions[0].text+'：'+fmt(r[$('#feature').value==='price'?'all_a_close':$('#feature').value],4)+' · 5% '+r.phase5+' / 9% '+r.phase9;};
$('#window').onchange=draw;$('#feature').onchange=draw;window.addEventListener('resize',draw);draw();
$('#download').onclick=()=>{const keys=Object.keys(DATA.daily[0]);const csv='\ufeff'+keys.join(',')+'\n'+DATA.daily.map(r=>keys.map(k=>JSON.stringify(r[k]??'')).join(',')).join('\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='turning_recomputed_daily.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
</script></body></html>
