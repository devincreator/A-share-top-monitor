<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>A股市场拐点观察</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f6f8;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;color:#163047}#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f3f6f8}.fab{position:fixed;right:18px;bottom:18px;z-index:60;border:0;border-radius:999px;background:#16794d;color:#fff;padding:12px 17px;font-weight:800;box-shadow:0 10px 30px rgba(22,121,77,.27);cursor:pointer}.drawer{position:fixed;right:18px;bottom:76px;z-index:61;width:min(380px,calc(100vw - 24px));max-height:min(620px,calc(100vh - 100px));overflow:auto;background:#fff;border:1px solid #dfe7ec;border-radius:16px;padding:16px;box-shadow:0 18px 55px rgba(16,43,64,.18);display:none}.drawer.on{display:block}.drawer h3{margin:0;font-size:17px}.desc{margin:5px 0 10px;color:#708293;font-size:11px;line-height:1.6}.preview{white-space:pre-wrap;word-break:break-word;background:#f7fafb;border:1px solid #e4eaee;border-radius:10px;padding:11px;font-size:11px;line-height:1.7;color:#365267;max-height:260px;overflow:auto}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.btn{border:1px solid #d9e3e9;background:#fff;color:#173e5c;border-radius:9px;padding:10px 9px;font-weight:800;cursor:pointer;text-align:center;text-decoration:none;font-size:12px}.btn.primary{background:#16794d;color:#fff;border-color:#16794d}.btn.wide{grid-column:1/-1}.status{min-height:16px;margin-top:6px;text-align:center;font-size:10px;color:#60798b}.modal{position:fixed;inset:0;z-index:80;background:rgba(16,43,64,.68);display:none;align-items:center;justify-content:center;padding:16px}.modal.on{display:flex}.modal-card{width:min(430px,94vw);max-height:94vh;overflow:auto;background:#fff;border-radius:16px;padding:12px;box-shadow:0 20px 70px rgba(0,0,0,.28)}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}.modal-head b{font-size:13px}.modal-head small{display:block;margin-top:2px;color:#718493}.close{border:0;background:#edf2f5;color:#486579;border-radius:8px;padding:7px 10px;cursor:pointer}.share-img{display:block;width:100%;height:auto;border:1px solid #e1e8ed;border-radius:10px;background:#f7fafb}.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}@media(max-width:700px){.fab{right:12px;bottom:12px;padding:11px 15px}.drawer{right:12px;bottom:66px}.actions{grid-template-columns:1fr}.btn.wide{grid-column:auto}}
</style>
</head>
<body>
<iframe id="app" src="app.html" title="A股市场拐点观察"></iframe>
<button class="fab" id="shareFab" type="button">微信分享</button>
<section class="drawer" id="shareDrawer" aria-label="微信分享工具">
  <h3>微信分享</h3>
  <div class="desc">摘要会从当前网页读取；人工发送时直接复制文字，或生成竖版图片。</div>
  <div class="preview" id="summaryPreview">正在读取网页数据…</div>
  <div class="actions">
    <button class="btn primary" id="copySummary" type="button">复制微信摘要</button>
    <button class="btn" id="makeImage" type="button">生成微信分享图</button>
    <a class="btn wide" href="app.html" target="_blank" rel="noopener">单独打开完整网页</a>
  </div>
  <div class="status" id="shareStatus"></div>
</section>
<div class="modal" id="imageModal" aria-hidden="true">
  <div class="modal-card">
    <div class="modal-head"><div><b>微信分享图</b><small>手机可长按保存；电脑可直接下载。</small></div><button class="close" id="closeModal" type="button">关闭</button></div>
    <img class="share-img" id="shareImage" alt="A股拐点观察微信分享图">
    <div class="modal-actions"><a class="btn primary" id="downloadImage" download="A股拐点观察.png">下载图片</a><button class="btn" id="copyAgain" type="button">复制文字摘要</button></div>
  </div>
</div>
<script>
const FALLBACK={asof:'2026-08-04',direction:'寻找底部',b5:'69.1',b9:'68.4',week5:'12.4%',month5:'40.2%',week9:'7.7%',month9:'23.0%',action:'等待中周期确认'};
const $=s=>document.querySelector(s),frame=$('#app');let SNAP={...FALLBACK};
function pageUrl(){return location.origin+location.pathname;}
function clean(t){return (t||'').replace(/\s+/g,' ').trim();}
function extract(){
  try{
    const d=frame.contentDocument;if(!d)return;
    const asof=clean(d.querySelector('.asof b')?.textContent).match(/\d{4}-\d{2}-\d{2}/)?.[0];
    const headline=clean(d.querySelector('#summary .action strong')?.textContent||d.querySelector('.action strong')?.textContent);
    const cards=[...d.querySelectorAll('#summary .sum,.sum')];
    let b5,b9;
    for(const c of cards){const t=clean(c.textContent);if(/Bottom-5|底部.?短周期/i.test(t))b5=clean(c.querySelector('.score')?.textContent);if(/Bottom-9|底部.?中周期/i.test(t))b9=clean(c.querySelector('.score')?.textContent);}
    const probs=[...d.querySelectorAll('#summary .prob>div,.prob>div')].map(el=>clean(el.textContent));
    let p5=probs.find(t=>/Bottom-5|短周期/i.test(t)),p9=probs.find(t=>/Bottom-9|中周期/i.test(t));
    const nums=t=>(t?.match(/\d+(?:\.\d+)?%/g)||[]);
    const a5=nums(p5),a9=nums(p9);
    SNAP={...FALLBACK,asof:asof||FALLBACK.asof,b5:b5||FALLBACK.b5,b9:b9||FALLBACK.b9,week5:a5[0]||FALLBACK.week5,month5:a5[1]||FALLBACK.month5,week9:a9[0]||FALLBACK.week9,month9:a9[1]||FALLBACK.month9,action:/尚未完成中周期确认/.test(headline)?'等待中周期确认':FALLBACK.action};
  }catch(e){SNAP={...FALLBACK};}
  $('#summaryPreview').textContent=summaryText();
}
function summaryText(){const s=SNAP;return `A股拐点观察｜${s.asof}\n\n当前方向：${s.direction}\n短周期底部状态：${s.b5}/100\n中周期底部状态：${s.b9}/100\n当前动作：${s.action}\n\n历史相似条件下形成底部的频率：\n未来1周：短周期 ${s.week5}｜中周期 ${s.week9}\n未来1个月：短周期 ${s.month5}｜中周期 ${s.month9}\n\n完整走势、历史信号和执行策略：\n${pageUrl()}\n\n历史表现用于说明模型特征，不代表未来一定重复。`;}
async function copyText(){const t=summaryText();if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t);return}const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}
function rr(ctx,x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
function txt(ctx,text,x,y,size,weight,color,align='left'){ctx.font=`${weight} ${size}px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif`;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='alphabetic';ctx.fillText(text,x,y)}
function imageData(){const s=SNAP,c=document.createElement('canvas');c.width=1080;c.height=1440;const x=c.getContext('2d');let g=x.createLinearGradient(0,0,0,1440);g.addColorStop(0,'#f7fafc');g.addColorStop(1,'#eef4f7');x.fillStyle=g;x.fillRect(0,0,1080,1440);txt(x,'A股市场拐点观察',70,110,48,800,'#163047');txt(x,`模型数据截至 ${s.asof}`,70,158,24,500,'#708293');rr(x,70,205,940,265,28,'#ffffff','#dfe7ec');txt(x,'当前方向',110,265,24,700,'#708293');txt(x,s.direction,110,350,72,900,'#247a5b');rr(x,110,382,410,52,26,'#edf7f2');txt(x,`当前动作：${s.action}`,315,417,24,800,'#247a5b','center');txt(x,'模型条件完成度',70,545,28,800,'#163047');rr(x,70,580,450,220,24,'#ffffff','#dfe7ec');rr(x,560,580,450,220,24,'#ffffff','#dfe7ec');txt(x,'底部·短周期',110,635,26,800,'#49657b');txt(x,s.b5,110,730,76,900,'#247a5b');txt(x,'/100',285,730,28,700,'#708293');txt(x,'底部·中周期',600,635,26,800,'#49657b');txt(x,s.b9,600,730,76,900,'#247a5b');txt(x,'/100',775,730,28,700,'#708293');txt(x,'历史相似条件下形成底部的频率',70,875,28,800,'#163047');rr(x,70,910,940,260,24,'#ffffff','#dfe7ec');txt(x,'未来1周',110,980,24,700,'#708293');txt(x,`短周期 ${s.week5}`,330,980,32,900,'#163047');txt(x,`中周期 ${s.week9}`,690,980,32,900,'#163047');x.strokeStyle='#e6ebef';x.beginPath();x.moveTo(110,1028);x.lineTo(970,1028);x.stroke();txt(x,'未来1个月',110,1100,24,700,'#708293');txt(x,`短周期 ${s.month5}`,330,1100,32,900,'#163047');txt(x,`中周期 ${s.month9}`,690,1100,32,900,'#163047');txt(x,'完整走势、历史信号和执行策略',70,1245,24,800,'#163047');txt(x,pageUrl(),70,1290,20,500,'#2a6f9e');txt(x,'历史表现用于说明模型特征，不代表未来一定重复。',70,1360,20,500,'#82919e');return c.toDataURL('image/png',.95)}
function openImage(){const u=imageData();$('#shareImage').src=u;$('#downloadImage').href=u;$('#imageModal').classList.add('on');$('#imageModal').setAttribute('aria-hidden','false')}
function closeImage(){$('#imageModal').classList.remove('on');$('#imageModal').setAttribute('aria-hidden','true')}
frame.addEventListener('load',()=>setTimeout(extract,250));$('#summaryPreview').textContent=summaryText();
$('#shareFab').onclick=()=>{$('#shareDrawer').classList.toggle('on');if($('#shareDrawer').classList.contains('on'))extract()};
$('#copySummary').onclick=async()=>{const st=$('#shareStatus');try{await copyText();st.textContent='已复制，可直接粘贴到微信';setTimeout(()=>st.textContent='',2200)}catch(e){st.textContent='复制失败，请长按上方摘要手动复制'}};
$('#makeImage').onclick=openImage;$('#closeModal').onclick=closeImage;$('#imageModal').onclick=e=>{if(e.target===$('#imageModal'))closeImage()};$('#copyAgain').onclick=async()=>{try{await copyText();$('#copyAgain').textContent='已复制';setTimeout(()=>$('#copyAgain').textContent='复制文字摘要',1600)}catch(e){}};
</script>
</body>
</html>
