<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>A股市场拐点观察</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f6f8;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;color:#163047}#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f3f6f8}.latest-pill{position:fixed;left:12px;bottom:12px;z-index:59;background:#fff;border:1px solid #dbe5ec;border-radius:999px;box-shadow:0 8px 22px rgba(16,43,64,.10);padding:10px 13px;font-size:11px;font-weight:800;color:#173e5c;cursor:pointer}.latest-panel{display:none;position:fixed;left:12px;bottom:63px;z-index:61;width:min(350px,calc(100vw - 24px));max-height:65vh;overflow:auto;padding:15px;border-radius:14px;background:#fff;border:1px solid #dfe7ec;box-shadow:0 15px 50px rgba(16,43,64,.22)}.latest-panel.on{display:block}.latest-panel h3{font-size:15px;margin:0 0 8px}.latest-panel .body{font-size:12px;color:#496174;line-height:1.75;white-space:pre-line}.latest-panel small{display:block;font-size:10px;color:#75899a;margin-top:9px;line-height:1.6}@media(max-width:700px){.latest-pill{left:9px;bottom:9px;font-size:10px;padding:10px 11px}.latest-panel{left:9px;bottom:58px}}.fab{position:fixed;right:18px;bottom:18px;z-index:60;border:0;border-radius:999px;background:#16794d;color:#fff;padding:12px 17px;font-weight:800;box-shadow:0 10px 30px rgba(22,121,77,.27);cursor:pointer}.drawer{position:fixed;right:18px;bottom:76px;z-index:61;width:min(380px,calc(100vw - 24px));max-height:min(620px,calc(100vh - 100px));overflow:auto;background:#fff;border:1px solid #dfe7ec;border-radius:16px;padding:16px;box-shadow:0 18px 55px rgba(16,43,64,.18);display:none}.drawer.on{display:block}.drawer h3{margin:0;font-size:17px}.desc{margin:5px 0 10px;color:#708293;font-size:11px;line-height:1.6}.preview{white-space:pre-wrap;word-break:break-word;background:#f7fafb;border:1px solid #e4eaee;border-radius:10px;padding:11px;font-size:11px;line-height:1.7;color:#365267;max-height:260px;overflow:auto}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.btn{border:1px solid #d9e3e9;background:#fff;color:#173e5c;border-radius:9px;padding:10px 9px;font-weight:800;cursor:pointer;text-align:center;text-decoration:none;font-size:12px}.btn.primary{background:#16794d;color:#fff;border-color:#16794d}.btn.wide{grid-column:1/-1}.status{min-height:16px;margin-top:6px;text-align:center;font-size:10px;color:#60798b}.modal{position:fixed;inset:0;z-index:80;background:rgba(16,43,64,.68);display:none;align-items:center;justify-content:center;padding:16px}.modal.on{display:flex}.modal-card{width:min(430px,94vw);max-height:94vh;overflow:auto;background:#fff;border-radius:16px;padding:12px;box-shadow:0 20px 70px rgba(0,0,0,.28)}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}.modal-head b{font-size:13px}.modal-head small{display:block;margin-top:2px;color:#718493}.close{border:0;background:#edf2f5;color:#486579;border-radius:8px;padding:7px 10px;cursor:pointer}.share-img{display:block;width:100%;height:auto;border:1px solid #e1e8ed;border-radius:10px;background:#f7fafb}.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}@media(max-width:700px){.fab{right:12px;bottom:12px;padding:11px 15px}.drawer{right:12px;bottom:66px}.actions{grid-template-columns:1fr}.btn.wide{grid-column:auto}}
</style>
</head>
<body>
<iframe id="app" src="app.html" title="A股市场拐点观察"></iframe>
<button class="latest-pill" type="button" id="latestPill">市场 10/08 · 全指5560.01</button>
<section class="latest-panel" id="latestPanel"><h3>最新市场行情</h3><div class="body" id="latestPanelBody">正在读取数据…</div><small>行情快照、价格波段、四模块完整信号使用不同的数据截止日期，不应混为一个判断。</small></section>
<button class="fab" id="shareFab" type="button">微信分享</button>
<section class="drawer" id="shareDrawer" aria-label="微信分享工具">
  <h3>微信分享</h3>
  <div class="desc">摘要会从当前网页读取；人工发送时直接复制文字，或生成竖版图片。</div>
  <div class="preview" id="summaryPreview">正在读取网页数据…</div>
  <div class="actions">
    <button class="btn primary" id="copySummary" type="button">复制微信摘要</button>
    <button class="btn" id="makeImage" type="button">生成微信分享图</button>
    <a class="btn wide" href="app.html" target="_blank" rel="noopener">单独打开完整网页</a>
  </div>
  <div class="status" id="shareStatus"></div>
</section>
<div class="modal" id="imageModal" aria-hidden="true">
  <div class="modal-card">
    <div class="modal-head"><div><b>微信分享图</b><small>手机可长按保存；电脑可直接下载。</small></div><button class="close" id="closeModal" type="button">关闭</button></div>
    <img class="share-img" id="shareImage" alt="A股拐点观察微信分享图">
    <div class="modal-actions"><a class="btn primary" id="downloadImage" download="A股拐点观察.png">下载图片</a><button class="btn" id="copyAgain" type="button">复制文字摘要</button></div>
  </div>
</div>
<script>
const FALLBACK={asof:'2026-08-04',direction:'寻找底部',b5:'69.1',b9:'68.4',week5:'12.4%',month5:'40.2%',week9:'7.7%',month9:'23.0%',action:'等待中周期确认'};
const $=s=>document.querySelector(s),frame=$('#app');let SNAP={...FALLBACK};
let MARKET={market_date:'2026-10-08',index:'000985.CSI',index_close:5560.01,index_change_pct:-1.56,index_amount_cny_approx:1610000000000,index_turnover_rate_pct:1.38,hs300_close:4310.28,hs300_change_pct:-1.09,zz1000_close:7138.58,zz1000_change_pct:-2.2,three_exchange_financing_balance_cny_yi:25445.96};
let CORE={asof:'2026-09-21',all_a_close:5921.92,phase5:'DOWN',phase9:'UP'};
const fmt=(n,d=2)=>Number.isFinite(Number(n))?Number(n).toFixed(d):'—';
function marketLine(){const m=MARKET;return `中证全指 ${m.index||'000985.CSI'}：${fmt(m.index_close)}（${fmt(m.index_change_pct)}%）\n成交额约${fmt(Number(m.index_amount_cny_approx)/1e12,2)}万亿元｜换手率${fmt(m.index_turnover_rate_pct)}%\n沪深300：${fmt(m.hs300_close)}（${fmt(m.hs300_change_pct)}%）\n中证1000：${fmt(m.zz1000_close)}（${fmt(m.zz1000_change_pct)}%）\n沪深北融资余额：${fmt(m.three_exchange_financing_balance_cny_yi)}亿元`;}
function updateLatestPanel(){const m=MARKET,c=CORE;$('#latestPill').textContent=`行情 ${m.market_date.slice(5)} · 全指${fmt(m.index_close)}`;$('#latestPanelBody').textContent=`【${m.market_date} 已核对收盘】\n${marketLine()}\n\n【${c.asof} 价格波段】\n5%：${c.phase5==='DOWN'?'下降': '上升'}｜9%：${c.phase9==='DOWN'?'下降':'上升'}\n当日中证全指：${fmt(c.all_a_close)}\n\n【${FALLBACK.asof} 完整模型快照】\n四模块规则信号尚未同口径续算至最新收盘。`;}
Promise.allSettled([fetch('data/latest_verified_market.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('market');return r.json()}),fetch('data/latest_state.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('core');return r.json()})]).then(a=>{if(a[0].status==='fulfilled')MARKET=a[0].value;if(a[1].status==='fulfilled')CORE=a[1].value;updateLatestPanel();$('#summaryPreview').textContent=summaryText()});
$('#latestPill').onclick=()=>$('#latestPanel').classList.toggle('on');
updateLatestPanel();
function pageUrl(){return location.origin+location.pathname;}
function clean(t){return (t||'').replace(/\s+/g,' ').trim();}
function extract(){
  try{
    const d=frame.contentDocument;if(!d)return;
    const asof=clean(d.querySelector('.asof b')?.textContent).match(/\d{4}-\d{2}-\d{2}/)?.[0];
    const headline=clean(d.querySelector('#summary .action strong')?.textContent||d.querySelector('.action strong')?.textContent);
    const cards=[...d.querySelectorAll('#summary .sum,.sum')];
    let b5,b9;
    for(const c of cards){const t=clean(c.textContent);if(/Bottom-5|底部.?短周期/i.test(t))b5=clean(c.querySelector('.score')?.textContent);if(/Bottom-9|底部.?中周期/i.test(t))b9=clean(c.querySelector('.score')?.textContent);}
    const probs=[...d.querySelectorAll('#summary .prob>div,.prob>div')].map(el=>clean(el.textContent));
    let p5=probs.find(t=>/Bottom-5|短周期/i.test(t)),p9=probs.find(t=>/Bottom-9|中周期/i.test(t));
    const nums=t=>(t?.match(/\d+(?:\.\d+)?%/g)||[]);
    const a5=nums(p5),a9=nums(p9);
    SNAP={...FALLBACK,asof:asof||FALLBACK.asof,b5:b5||FALLBACK.b5,b9:b9||FALLBACK.b9,week5:a5[0]||FALLBACK.week5,month5:a5[1]||FALLBACK.month5,week9:a9[0]||FALLBACK.week9,month9:a9[1]||FALLBACK.month9,action:/尚未完成中周期确认/.test(headline)?'等待中周期确认':FALLBACK.action};
  }catch(e){SNAP={...FALLBACK};}
  $('#summaryPreview').textContent=summaryText();
}
function summaryText(){const s=SNAP,m=MARKET,c=CORE;return `A股市场收盘速览｜${m.market_date}
${marketLine()}

【价格波段｜${c.asof}】
5%：${c.phase5==='DOWN'?'下降':'上升'}｜9%：${c.phase9==='DOWN'?'下降':'上升'}
该部分只反映截至上述日期的价格波段变化。

【四模块完整历史快照｜${s.asof}】
当时方向：${s.direction}
底部短周期：${s.b5}/100｜底部中周期：${s.b9}/100
当时动作：${s.action}
历史相似条件下底部频率：
未来1周：短周期 ${s.week5}｜中周期 ${s.week9}
未来1个月：短周期 ${s.month5}｜中周期 ${s.month9}

完整网页：${pageUrl()}

提示：行情、价格波段、四模块完整信号截止日期不同。未复核的近期正式信号不作判断，历史表现不代表未来一定重复。`;}
async function copyText(){const t=summaryText();if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t);return}const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}
function rr(ctx,x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
function txt(ctx,text,x,y,size,weight,color,align='left'){ctx.font=`${weight} ${size}px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif`;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='alphabetic';ctx.fillText(text,x,y)}
function imageData(){const s=SNAP,c=document.createElement('canvas');c.width=1080;c.height=1440;const x=c.getContext('2d');let g=x.createLinearGradient(0,0,0,1440);g.addColorStop(0,'#f7fafc');g.addColorStop(1,'#eef4f7');x.fillStyle=g;x.fillRect(0,0,1080,1440);txt(x,'A股市场拐点观察',70,110,48,800,'#163047');txt(x,`模型数据截至 ${s.asof}`,70,158,24,500,'#708293');rr(x,70,205,940,265,28,'#ffffff','#dfe7ec');txt(x,'历史模型方向',110,265,24,700,'#708293');txt(x,s.direction,110,350,72,900,'#247a5b');rr(x,110,382,410,52,26,'#edf7f2');txt(x,`${s.asof.slice(5)}动作：${s.action}`,315,417,24,800,'#247a5b','center');txt(x,'模型条件完成度',70,545,28,800,'#163047');rr(x,70,580,450,220,24,'#ffffff','#dfe7ec');rr(x,560,580,450,220,24,'#ffffff','#dfe7ec');txt(x,'底部·短周期',110,635,26,800,'#49657b');txt(x,s.b5,110,730,76,900,'#247a5b');txt(x,'/100',285,730,28,700,'#708293');txt(x,'底部·中周期',600,635,26,800,'#49657b');txt(x,s.b9,600,730,76,900,'#247a5b');txt(x,'/100',775,730,28,700,'#708293');txt(x,'历史相似条件下形成底部的频率',70,875,28,800,'#163047');rr(x,70,910,940,260,24,'#ffffff','#dfe7ec');txt(x,'未来1周',110,980,24,700,'#708293');txt(x,`短周期 ${s.week5}`,330,980,32,900,'#163047');txt(x,`中周期 ${s.week9}`,690,980,32,900,'#163047');x.strokeStyle='#e6ebef';x.beginPath();x.moveTo(110,1028);x.lineTo(970,1028);x.stroke();txt(x,'未来1个月',110,1100,24,700,'#708293');txt(x,`短周期 ${s.month5}`,330,1100,32,900,'#163047');txt(x,`中周期 ${s.month9}`,690,1100,32,900,'#163047');txt(x,'完整走势、历史信号和执行策略',70,1245,24,800,'#163047');txt(x,pageUrl(),70,1290,20,500,'#2a6f9e');txt(x,`${MARKET.market_date.slice(5)}全指${fmt(MARKET.index_close)}；模型仅截至${s.asof.slice(5)}。历史不代表未来。`,70,1360,20,500,'#82919e');return c.toDataURL('image/png',.95)}
function openImage(){const u=imageData();$('#shareImage').src=u;$('#downloadImage').href=u;$('#imageModal').classList.add('on');$('#imageModal').setAttribute('aria-hidden','false')}
function closeImage(){$('#imageModal').classList.remove('on');$('#imageModal').setAttribute('aria-hidden','true')}
frame.addEventListener('load',()=>setTimeout(extract,250));$('#summaryPreview').textContent=summaryText();
$('#shareFab').onclick=()=>{$('#shareDrawer').classList.toggle('on');if($('#shareDrawer').classList.contains('on'))extract()};
$('#copySummary').onclick=async()=>{const st=$('#shareStatus');try{await copyText();st.textContent='已复制，可直接粘贴到微信';setTimeout(()=>st.textContent='',2200)}catch(e){st.textContent='复制失败，请长按上方摘要手动复制'}};
$('#makeImage').onclick=openImage;$('#closeModal').onclick=closeImage;$('#imageModal').onclick=e=>{if(e.target===$('#imageModal'))closeImage()};$('#copyAgain').onclick=async()=>{try{await copyText();$('#copyAgain').textContent='已复制';setTimeout(()=>$('#copyAgain').textContent='复制文字摘要',1600)}catch(e){}};
</script>
</body>
</html>
